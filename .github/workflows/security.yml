name: Security Audit & Secret Scanning

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  security-audit:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verify Secret Sanitation
        run: |
          echo "Scanning repository for hardcoded secrets..."
          ! git grep -i "sk_live_" || (echo "Found committed secret key" && exit 1)
